<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6200ea">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <title>PWA Exercícios</title>
</head>
<body>
    <h1>Lista de exercícios Renato</h1>
    <h3>Exercício 1</h3>
    <input type="text" id="texto" placeholder="Digite aqui o nome da disciplina">
    <button id="botao">Mostrar</button>
    <p id="resultado"></p>

    <h3>Exercício 2</h3>
    <input type="number" id="numero1" placeholder="Digite aqui um número">
    <input type="number" id="numero2" placeholder="Digite aqui outro número">
    <button id="somar">Somar</button>
    <p id="resultadoSoma"></p>

    <h3>Exercício 3</h3>
    <input type="number" id="nota1" placeholder="Digite aqui a nota">
    <input type="number" id="nota2" placeholder="Digite aqui outra nota">
    <input type="number" id="nota3" placeholder="Digite aqui mais outra nota">
    <input type="number" id="nota4" placeholder="Digite aqui a última nota">
    <button id="calcular">Calcular Média</button>
    <p id="resultadoMédia"></p>

    <h3>Exercício 5</h3>
    <input type="number" id="numerotabu" placeholder="Digite um número para a sua tabuada">
    <button id="tabuada">Mostrar Tabuada</button>
    <p id="tabuadaResultado"></p>
    <p id="multiplica1"></p>
    <p id="multiplica2"></p>
    <p id="multiplica3"></p>
    <p id="multiplica4"></p>
    <p id="multiplica5"></p>
    <p id="multiplica6"></p>
    <p id="multiplica7"></p>
    <p id="multiplica8"></p>
    <p id="multiplica9"></p>
    <p id="multiplica10"></p>

    <h3>Exercício 6</h3>
    <input type="number" id="maiorInput" placeholder="Digite um valor">
    <button id="adicionar">Adicionar Valor ao vetor.</button>
    <p id="vetorResult"></p>

    <h3>Exercício 7</h3>
    <P>Valores dentro do vetor: 1, 2, 3, 4, 5, 6, 7, 8, 9 e 10.</P>
    <button id="impares">Mostrar Impares</button>
    <p id="impar"></p>

    <h3>Exercício 8</h3>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <button id="inverter">Escrever de trás pra frente</button>
    <p id="tras"></p>

    <h3>Exercício 9</h3>
    <input type="text" id="nomeFcnr" placeholder="Digite o nome">
    <input type="number" id="idadeFcnr" placeholder="Digite a idade">
    <input type="text" id="sexoFcnr" placeholder="Digite seu sexo">
    <input type="number" id="salarioFcnr" placeholder="Digite o salário">
    <button id="cadastro">Cadastrar</button>
    <p id="listagem"></p>

    <h3>Exercício 10</h3>
    <input type="number" id="primeiro" placeholder="Digite um número">
    <input type="number" id="segundo" placeholder="Digite um número">
    <button id="equacao">Realizar operações</button>
    <p id="saida"></p>
    <P id="adicao"></P>
    <P id="subtracao"></P>
    <P id="multiplicacao"></P>
    <P id="divisao"></P>

    <script src="exercicio.js"></script>
</body>
</html>
